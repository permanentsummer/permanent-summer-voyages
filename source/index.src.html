<title>Permanent Summer Voyages</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Agence de voyage indépendante à Maurice : billets d'avion, hôtels, groupes, voyages d'affaires. 35 ans d'expérience et un humain qui répond.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@300;400;500&family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&display=swap">
<style>
/* Layout concept: an image-led travel magazine. Full-bleed photography, quiet white pages,
   small uppercase navigation, display serif used only for headlines. Lagoon green marks action. */
:root{
  --bg:#ffffff; --surface:#f3f2ee; --ink:#1b1c1b; --muted:#686a66; --line:#e2e0da;
  --accent:#0d4d49; --accent-ink:#ffffff; --scrim:rgba(10,14,13,.42); --card:#ffffff;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Jost","Futura","Avenir Next","Helvetica Neue",Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --gut:max(16px, env(safe-area-inset-left,0px));
  --gutr:max(16px, env(safe-area-inset-right,0px));
  --wrap:1280px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111312; --surface:#1a1d1c; --ink:#ecebe6; --muted:#9c9e98; --line:#2b2f2d;
  --accent:#7cc7bc; --accent-ink:#0b1513; --scrim:rgba(0,0,0,.5); --card:#161918; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111312; --surface:#1a1d1c; --ink:#ecebe6; --muted:#9c9e98; --line:#2b2f2d;
  --accent:#7cc7bc; --accent-ink:#0b1513; --scrim:rgba(0,0,0,.5); --card:#161918; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,h4{font-weight:400;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:400;color:var(--muted)}
.display{font-family:var(--display);font-weight:400;letter-spacing:-.01em;line-height:1.05}
.h2{font-size:clamp(26px,3.4vw,38px);line-height:1.15;font-weight:400}
.lede{font-size:18px;color:var(--muted);max-width:60ch}
.it{font-family:var(--serif);font-style:italic;font-weight:300}
.section{padding-block:clamp(56px,8vw,104px)}
.section.tight{padding-block:clamp(40px,5vw,64px)}
.surface{background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 26px;border-radius:2px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);font-size:14px;letter-spacing:.06em;font-weight:400;cursor:pointer;transition:opacity .2s,background .2s;white-space:nowrap}
.btn:hover{opacity:.85}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.light{background:#fff;border-color:#fff;color:#1b1c1b}
.btn.light.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.8)}
.link{border-bottom:1px solid currentColor;padding-bottom:2px;font-size:14px;letter-spacing:.04em}
.ph{background:var(--surface)}
.ph img{width:100%;height:100%;object-fit:cover}

/* ---------- header ---------- */
.util{font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.util .wrap{display:flex;justify-content:space-between;align-items:center;min-height:36px;gap:16px}
.util .hide-s{display:inline}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line);transition:background .25s,border-color .25s,color .25s}
header.site .bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;height:72px;gap:24px}
.logo{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.logo b{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.02em}
.logo span{font-size:10px;letter-spacing:.42em;text-transform:uppercase;margin-top:5px}
nav.main{display:flex;justify-content:center;gap:24px;font-size:14px;letter-spacing:.03em}
nav.main button,nav.main a{background:none;border:0;padding:24px 0;cursor:pointer;font-weight:400}
nav.main button::after{content:"";display:inline-block;width:6px;height:6px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);margin-left:9px}
.right{display:flex;justify-content:flex-end;align-items:center;gap:18px;font-size:14px}
.lang{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.lang button,.lang a{background:none;border:0;padding:5px 9px;font-size:12px;letter-spacing:.08em;cursor:pointer;color:var(--muted)}
.lang [aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.burger{display:none;background:none;border:0;width:40px;height:40px;cursor:pointer;padding:8px}
.burger i{display:block;height:1px;background:currentColor;margin:6px 0}
/* transparent header on hero pages */
body.overlay header.site:not(.solid){background:transparent;border-color:transparent;color:#fff;position:fixed;left:0;right:0}
body.overlay header.site:not(.solid) .lang{border-color:rgba(255,255,255,.4)}
body.overlay header.site:not(.solid) .lang button,body.overlay header.site:not(.solid) .lang a{color:rgba(255,255,255,.75)}
body.overlay header.site:not(.solid) .lang [aria-pressed="true"]{background:#fff;color:#1b1c1b}
body.overlay header.site:not(.solid) .btn.ghost{color:#fff;border-color:rgba(255,255,255,.8)}
body.overlay .util{display:none}

/* mega menu */
.mega{position:absolute;left:0;right:0;top:100%;background:var(--bg);color:var(--ink);border-top:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:0 30px 60px -30px rgba(0,0,0,.25)}
.mega .wrap{display:grid;grid-template-columns:220px 1fr 280px;gap:40px;padding-block:36px 40px}
.mega .regions{display:flex;flex-direction:column;gap:2px}
.mega .regions button{display:flex;justify-content:space-between;align-items:center;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer;font-size:15px;border-radius:2px}
.mega .regions button small{color:var(--muted);font-size:12px}
.mega .regions button[aria-selected="true"]{background:var(--surface)}
.mega .links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 28px;align-content:start}
.mega .links a{font-size:15px;padding:6px 0;border-bottom:1px solid transparent}
.mega .links a:hover{border-color:var(--line)}
.mega .links a.all{grid-column:1/-1;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mega .promo{position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;border-radius:2px}
.mega .promo img{width:100%;height:100%;object-fit:cover}
.mega .promo div{position:absolute;inset:auto 0 0;padding:18px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.mega.insp .wrap{grid-template-columns:1fr 1fr 280px}
.mega.insp .col{display:flex;flex-direction:column;gap:4px}
.mega.insp .col a{padding:8px 0;font-size:15px}

/* drawer */
.drawer{position:fixed;inset:0;z-index:80;background:var(--bg);color:var(--ink);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) var(--gutr) calc(env(safe-area-inset-bottom,0px) + 32px) var(--gut)}
.drawer .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.drawer .x{background:none;border:0;font-size:30px;line-height:1;cursor:pointer;width:44px;height:44px}
.drawer details{border-bottom:1px solid var(--line)}
.drawer summary,.drawer > a{display:block;padding:16px 0;font-size:20px;cursor:pointer;list-style:none;border-bottom:1px solid var(--line)}
.drawer details summary{border:0}
.drawer details a{display:block;padding:7px 0 7px 12px;color:var(--muted)}
.drawer details div{padding-bottom:14px}

/* ---------- hero ---------- */
.hero{position:relative;min-height:min(92vh,860px);display:flex;align-items:flex-end;color:#fff;overflow:hidden}
.hero > .ph{position:absolute;inset:0}
.hero > .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.05) 55%,rgba(0,0,0,.55) 100%)}
.hero .wrap{position:relative;width:100%;padding-block:150px 48px}
.hero h1{font-size:clamp(44px,7.2vw,104px);max-width:12ch}
.hero .sub{font-size:clamp(17px,1.6vw,20px);max-width:46ch;margin-top:18px;opacity:.92}
.hero.short{min-height:min(70vh,620px)}
.hero.short h1{font-size:clamp(40px,6vw,84px)}
.crumbs{font-size:13px;letter-spacing:.06em;opacity:.85;margin-bottom:14px}
.crumbs a{border-bottom:1px solid rgba(255,255,255,.5)}

.search{margin-top:36px;background:var(--card);color:var(--ink);display:grid;grid-template-columns:1.4fr 1fr 1fr .8fr auto;border-radius:2px;box-shadow:0 20px 50px -20px rgba(0,0,0,.35);max-width:1040px}
.search label{display:flex;flex-direction:column;padding:12px 18px;border-right:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:0}
.search input,.search select{border:0;background:transparent;padding:4px 0 0;font-size:15px;letter-spacing:0;text-transform:none;outline:none;width:100%;min-width:0}
.search .btn{height:auto;border-radius:0 2px 2px 0}
.search-foot{margin-top:16px;font-size:14px}
.search-foot a{border-bottom:1px solid rgba(255,255,255,.6);padding-bottom:1px}

/* ---------- section heads ---------- */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:32px;flex-wrap:wrap}
.head .h2{max-width:22ch}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:28px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:12px 0;font-size:15px;cursor:pointer;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}

/* rails & cards */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:thin}
.rail > *{scroll-snap-align:start}
.card{display:flex;flex-direction:column;gap:12px;min-width:0}
.card .ph{aspect-ratio:3/4;overflow:hidden;border-radius:2px;max-width:100%}
.card .ph img{transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.card:hover .ph img{transform:scale(1.04)}
.card h3{font-size:18px;font-weight:400;line-height:1.25}
.card .meta{font-size:14px;color:var(--muted)}
.card.wide .ph{aspect-ratio:4/3}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:36px 20px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}

/* pillars */
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px}
.pillar .big{font-family:var(--display);font-size:clamp(30px,3vw,40px);line-height:1.1;margin-bottom:14px}
.pillar .big em{font-family:var(--serif);font-style:italic;font-weight:300}
.pillar p{color:var(--muted);max-width:36ch}

/* split feature */
.split{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(32px,6vw,96px);align-items:center}
.split.rev{grid-template-columns:1.15fr 1fr}
.split.rev .media{order:-1}
.split .media{aspect-ratio:3/2;overflow:hidden;border-radius:2px;max-width:100%}
.split .text{display:flex;flex-direction:column;gap:20px;align-items:flex-start;min-width:0}

/* offers */
.offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.offer{border:1px solid var(--line);padding:30px 28px;display:flex;flex-direction:column;gap:14px;background:var(--card);border-radius:2px}
.offer .tier{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.offer h3{font-family:var(--display);font-size:28px}
.offer ul{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:15px}
.offer li{padding-left:18px;position:relative}
.offer li::before{content:"";position:absolute;left:0;top:.75em;width:8px;height:1px;background:var(--ink)}

/* big cta band */
.band{position:relative;color:#fff;overflow:hidden}
.band > .ph{position:absolute;inset:0}
.band > .ph::after{content:"";position:absolute;inset:0;background:var(--scrim)}
.band .wrap{position:relative;padding-block:clamp(88px,12vw,160px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:22px}
.band h2{font-size:clamp(34px,5vw,64px);max-width:16ch}
.band p{max-width:54ch;font-size:18px;opacity:.92}
.band .ctas{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}

/* assistance scenarios */
.scen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.scen .ph{aspect-ratio:1/1;border-radius:2px;overflow:hidden;max-width:100%}
.scen .t{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.scen .t b{font-weight:400;font-size:17px}
.scen .t span{color:var(--muted);font-size:15px}
.clock{font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}

/* trending tiles */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.tile{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:2px;color:#fff;max-width:100%}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.tile:hover img{transform:scale(1.05)}
.tile div{position:absolute;inset:auto 0 0;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.tile b{display:block;font-weight:400;font-size:17px}
.tile small{font-size:13px;opacity:.85}

/* quotes */
.quotes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px}
.quote blockquote{margin:0;font-family:var(--serif);font-style:italic;font-weight:300;font-size:21px;line-height:1.45}
.quote cite{display:block;margin-top:14px;font-style:normal;font-size:14px;color:var(--muted)}
.sample{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px dashed var(--muted);color:var(--muted);padding:2px 7px;border-radius:2px;margin-top:10px}

/* facts strip */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts > div{padding:26px 24px 26px 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.facts > div + div{padding-left:24px;border-left:1px solid var(--line)}
.facts dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-size:14px;background:none;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* destination detail */
.dgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(32px,6vw,88px)}
.prose{display:flex;flex-direction:column;gap:20px;font-size:18px;max-width:62ch}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.pair .ph{aspect-ratio:4/5;border-radius:2px;overflow:hidden;max-width:100%}
.itin{list-style:none;margin:0;padding:0;counter-reset:d}
.itin li{counter-increment:d;display:grid;grid-template-columns:72px 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--line);align-items:baseline}
.itin li::before{content:"Jour " counter(d);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
html[lang="en"] .itin li::before{content:"Day " counter(d)}
.aside{position:sticky;top:96px;align-self:start;border:1px solid var(--line);padding:28px;display:flex;flex-direction:column;gap:18px;background:var(--card);border-radius:2px}
.aside h3{font-family:var(--display);font-size:26px}
.aside .row{display:flex;flex-direction:column;gap:4px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.aside .row span:first-child{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

/* theme tiles */
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.theme{position:relative;aspect-ratio:5/4;overflow:hidden;border-radius:2px;color:#fff;max-width:100%}
.theme img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.theme:hover img{transform:scale(1.04)}
.theme div{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;background:linear-gradient(transparent 35%,rgba(0,0,0,.62))}
.theme h3{font-family:var(--display);font-size:30px}
.theme p{font-size:15px;opacity:.9;max-width:40ch;margin-top:6px}

/* forms */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--card);padding:12px 14px;border-radius:2px;font-size:16px;width:100%;min-width:0}
.field textarea{min-height:120px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer}
.checks input{accent-color:var(--accent)}
.done{border:1px solid var(--accent);padding:28px;border-radius:2px;display:flex;flex-direction:column;gap:16px}
.done pre{white-space:pre-wrap;font-family:var(--body);font-size:14px;background:var(--surface);padding:16px;margin:0;border-radius:2px;max-height:300px;overflow:auto}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;border-top:1px solid var(--ink);padding-top:18px;display:flex;flex-direction:column;gap:8px}
.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--display);font-size:28px}
.steps b{font-weight:400;font-size:18px}
.steps span{color:var(--muted);font-size:15px}
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}

/* calendly */
.cal{border:1px solid var(--line);min-height:680px;border-radius:2px;background:var(--card);position:relative;overflow:hidden}
.calendly-inline-widget{min-width:280px;height:680px}
.calfb{padding:32px;display:flex;flex-direction:column;gap:20px}
.slots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font-variant-numeric:tabular-nums}
.slots div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:14px;border-radius:999px;color:var(--muted)}
.slots .on{background:var(--surface);color:var(--ink);font-weight:400}
.slots .wk{font-size:11px;letter-spacing:.08em;text-transform:uppercase;aspect-ratio:auto;padding:6px 0}

/* team */
.team{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(32px,5vw,72px)}
.profile{display:flex;flex-direction:column;gap:24px;min-width:0}
.profile .ph{aspect-ratio:4/5;border-radius:2px;overflow:hidden;max-width:100%}
.profile .pbody{display:flex;flex-direction:column;gap:12px}
.profile .prose{margin-top:8px}
@media (max-width:820px){.team{grid-template-columns:1fr}}
/* monogram */
.mono{aspect-ratio:4/5;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;justify-content:space-between;padding:28px;border-radius:2px;max-width:100%}
.mono b{font-family:var(--display);font-size:clamp(90px,12vw,160px);font-weight:400;line-height:.9}

/* footer */
footer.site{background:var(--surface);padding-block:72px 32px;margin-top:0}
footer .cols{display:grid;grid-template-columns:1.4fr repeat(4,minmax(0,1fr));gap:36px}
footer h4{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:400}
footer .cols a{display:block;padding:4px 0;font-size:15px}

function miniCal(){
  const wk = lang==='fr' ? ["L","M","M","J","V","S","D"] : ["M","T","W","T","F","S","S"];
  const today = new Date(); const y = today.getFullYear(), m = today.getMonth();
  const first = (new Date(y,m,1).getDay()+6)%7, days = new Date(y,m+1,0).getDate();
  let cells = wk.map(w=>`<div class="wk">${w}</div>`).join("");
  for (let i=0;i<first;i++) cells += "<div></div>";
  for (let d=1; d<=days; d++){ const dow=(first+d-1)%7; const on = d>today.getDate() && dow<6; cells += `<div class="${on?'on':''}">${d}</div>`; }
  const mn = today.toLocaleDateString(lang==='fr'?'fr-FR':'en-GB',{month:'long',year:'numeric'});
  return `<div><div style="text-transform:capitalize;margin-bottom:10px">${mn}</div><div class="slots">${cells}</div></div>`;
}

      <a class="btn ghost" href="#devis" data-offer="${o.id}">${t(U.quote)}</a>
      <a class="btn ghost" href="#appel">${t(U.book)}</a>
    </aside>
  </div></section>
  ${others.length ? `<section class="section surface"><div class="wrap"><div class="head"><h2 class="h2">${t({fr:"Autres offres",en:"Other offers"})}</h2><a class="link" href="#offres">${t({fr:"Toutes les offres",en:"All offers"})}</a></div><div class="offers-grid">${others.map(offerCard).join("")}</div></div></section>` : ""}`;
}
function reel(a, i, small){
  const d = byS(a.dest);
  return `<button class="reel" data-video="${i}" type="button" aria-label="${esc(t(a.trip))}">
    <div class="ph">${img(a.poster, t(a.trip))}<span class="play"></span><span class="cap"><small>${esc(a.handle)}</small><b>${t(a.trip)}</b></span></div>
    ${small ? "" : `<blockquote>« ${t(a.q)} »</blockquote><span class="note">${t(a.name)}${d ? ` · ${t(d.n)}` : ""}</span>`}
    ${a.sample && !small ? `<span class="sample" style="margin:0;align-self:flex-start">${t(U.example)}</span>` : ""}
  </button>`;
}
function travellers(){
  const list = window.AMBASSADORS || [];
  return `
  <section class="hero short"><div class="ph">${img("plane2","",true)}</div><div class="wrap">
    <div class="eyebrow" style="color:#fff">${t(U.travellers)}</div>
    <h1 class="display" style="margin-top:12px">${t({fr:"Ils sont partis avec nous",en:"They travelled with us"})}</h1>
    <p class="sub">${t({fr:"Nos ambassadeurs racontent leur voyage en quelques secondes. Des vraies personnes, de vrais itinéraires.",en:"Our ambassadors share their trip in a few seconds. Real people, real itineraries."})}</p>
  </div></section>
  <section class="section"><div class="wrap"><div class="reels">${list.map((a,i)=>reel(a,i)).join("")}</div></div></section>
  <section class="section surface"><div class="wrap split">
    <div class="text"><span class="eyebrow">${t({fr:"Ambassadeurs",en:"Ambassadors"})}</span><h2 class="h2">${t({fr:"Vous créez du contenu voyage ?",en:"Do you create travel content?"})}</h2><p class="lede">${t({fr:"Nous travaillons avec des voyageurs, couples et familles qui aiment partager. Parlons d'une collaboration.",en:"We work with travellers, couples and families who love to share. Let's talk about working together."})}</p>
      <a class="btn" href="${wa(lang==='fr'?"Bonjour, je souhaite devenir ambassadeur Permanent Summer Voyages.":"Hello, I'd like to become a Permanent Summer Voyages ambassador.")}" target="_blank" rel="noopener">${t({fr:"Devenir ambassadeur",en:"Become an ambassador"})}</a></div>
    <div class="media ph">${img("santorini2")}</div>
  </div></section>`;
}
function videoModal(){
  if (state.video == null) return "";
  const a = (window.AMBASSADORS||[])[state.video]; if (!a) return "";
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(t(a.trip))}" data-act="closevideo">
    <button class="close" data-act="closevideo" aria-label="${t({fr:'Fermer',en:'Close'})}">×</button>
    ${a.video ? `<video src="${esc(a.video)}" poster="${ROOT}img/${a.poster}.jpg" controls autoplay playsinline></video>`
      : `<div class="soon">${img(a.poster)}<span class="eyebrow" style="color:#fff">${esc(a.handle)}</span><b style="font-weight:400;font-size:22px">${t(a.trip)}</b><span>${t({fr:"Vidéo bientôt disponible",en:"Video coming soon"})}</span></div>`}
  </div>`;
}

function legal(){
  return `<section class="section"><div class="wrap" style="max-width:820px">
    <span class="eyebrow">${t({fr:"Mentions légales",en:"Legal notice"})}</span>
    <h1 class="display" style="font-size:clamp(36px,4.6vw,56px);margin:12px 0 28px">${t({fr:"Informations société",en:"Company information"})}</h1>
    <div class="prose" style="font-size:16px">
      <p><b style="font-weight:400">Permanent Summer Lda</b><br>${t({fr:"Société de droit portugais · NIF : à compléter · Siège : Algarve, Portugal",en:"Portuguese company · NIF: to complete · Registered office: Algarve, Portugal"})}</p>
      <p>${t({fr:"Immatriculation agence de voyage (RNAVT, Turismo de Portugal) : en cours. Garantie financière et assurance responsabilité civile professionnelle : à compléter.",en:"Travel agency registration (RNAVT, Turismo de Portugal): in progress. Financial guarantee and professional liability insurance: to complete."})}</p>
      <p>${t({fr:"Données personnelles : les informations transmises via ce site servent uniquement à répondre à votre demande, conformément au RGPD. Politique de confidentialité et conditions générales de vente à publier avant le lancement.",en:"Personal data: information sent through this site is used only to answer your request, in line with the GDPR. Privacy policy and terms of sale to be published before launch."})}</p>
      <p class="note">${t({fr:"Page de travail : contenu à valider avec le comptable et le juriste.",en:"Working page: content to be validated with the accountant and lawyer."})}</p>
    </div></div></section>`;
}
function notFound(){ return `<section class="section"><div class="wrap"><h1 class="display h2">${t({fr:"Page introuvable",en:"Page not found"})}</h1><p style="margin-top:16px"><a class="link" href="#home">${t({fr:"Retour à l'accueil",en:"Back to home"})}</a></p></div></section>`; }

/* ---------- router ---------- */
function route(){
  const h = STATIC ? window.SITE.page : ((location.hash || "#home").slice(1).split("/")[0] || "home");
  let html, overlay = true;
  if (h === "home" || h === "") html = home();
  else if (h === "destinations") html = destinations();
  else if (h.startsWith("dest-")) html = destPage(h.slice(5));
  else if (h === "inspiration") html = inspiration();
  else if (h.startsWith("theme-")) html = themePage(h.slice(6));
  else if (h === "offres") html = offersPage();
  else if (h.startsWith("offre-")) html = offerPage(h.slice(6));
  else if (h === "voyageurs") html = travellers();
  else if (h === "groupes") html = groups();
  else if (h === "entreprises") html = corporate();
  else if (h === "a-propos") { html = about(); overlay = false; }
  else if (h === "appel") { html = book(); overlay = false; }
  else if (h === "devis") { html = quotePage(); overlay = false; }
  else if (h === "mentions") { html = legal(); overlay = false; }
  else { html = notFound(); overlay = false; }
  return { html, overlay, key:h };
}
let lastKey = null;
function render(keepScroll){
  const r = route();
  document.documentElement.lang = lang;
  document.body.classList.toggle("overlay", r.overlay);
  document.getElementById("app").innerHTML = linkify(header() + `<main>${r.html}</main>` + footer() + drawer() + videoModal());
  if (!STATIC) document.title = "Permanent Summer Voyages";
  if (!keepScroll && r.key !== lastKey) window.scrollTo(0,0);
  lastKey = r.key;
  onScroll();
  if (r.key === "appel") mountCalendly();
}
function onScroll(){
  const hdr = document.getElementById("hdr"); if (!hdr) return;
  hdr.classList.toggle("solid", window.scrollY > 40 || !!state.megaOpen);
}
/* Calendly: one loader for the inline widget (#appel page) and the popup (every "Book a call" button) */
let calState = "idle"; const calWait = [];
function loadCalendly(cb){
  if (window.Calendly) { cb && cb(true); return; }
  if (cb) calWait.push(cb);
  if (calState !== "idle") return;
  calState = "loading";
  try { const l = document.createElement("link"); l.rel = "stylesheet"; l.href = "https://assets.calendly.com/assets/external/widget.css"; document.head.appendChild(l); } catch(e){}
  const s = document.createElement("script");
  s.src = "https://assets.calendly.com/assets/external/widget.js"; s.async = true;
  const done = ok => { calState = ok ? "ready" : "failed"; calWait.splice(0).forEach(f => f(ok)); };
  s.onload = () => done(!!window.Calendly); s.onerror = () => done(false);
  document.head.appendChild(s);
  setTimeout(() => { if (calState === "loading") done(false); }, 4000);
}
function mountCalendly(){
  const fb = document.getElementById("calfb"), w = document.getElementById("calw");
  const showFb = () => { if (w && !w.querySelector("iframe")) { w.hidden = true; fb.hidden = false; } };
  loadCalendly(ok => {
    if (!ok) return showFb();
    try { window.Calendly.initInlineWidget({ url: w.dataset.url, parentElement: w }); } catch(e){ showFb(); }
    setTimeout(showFb, 3500);
  });
}
function toast(msg){ const d=document.createElement("div"); d.className="toast"; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-lang],[data-mega],[data-region],[data-tab],[data-filter],[data-act],[data-pre],[data-offer],[data-copy],[data-video],[data-k],a[href^='#']");
  if (!el) { if (state.megaOpen && !e.target.closest(".mega")) { state.megaOpen=null; render(true); } return; }
  if (el.dataset.lang){ lang = el.dataset.lang; try{localStorage.setItem("ps-lang",lang)}catch(_){}; render(true); return; }
  if (el.dataset.mega){ state.megaOpen = state.megaOpen===el.dataset.mega ? null : el.dataset.mega; render(true); return; }
  if (el.dataset.region){ state.megaRegion = el.dataset.region; render(true); return; }
  if (el.dataset.tab){ state.homeTab = el.dataset.tab; render(true); return; }
  if (el.dataset.act==="drawer"){ state.drawer = !state.drawer; render(true); return; }
  if (el.dataset.act==="closevideo"){ if (e.target.closest("video,.soon")) return; state.video = null; render(true); return; }
  if (el.dataset.video != null){ state.video = +el.dataset.video; render(true); return; }
  const isCall = STATIC ? (el.dataset.k === "appel" && window.SITE.page !== "appel") : (el.getAttribute("href") === "#appel" && location.hash !== "#appel");
  if (isCall && window.Calendly){
    e.preventDefault(); state.megaOpen = null; state.drawer = false; if (STATIC) render(true);
    try { window.Calendly.initPopupWidget({ url: C.calendly + "?hide_gdpr_banner=1" }); } catch(_) { if (STATIC) location.href = el.href; else location.hash = "appel"; }
    return;
  }
  if (el.dataset.copy){ const txt = document.getElementById(el.dataset.copy).textContent; navigator.clipboard.writeText(txt).then(()=>toast(lang==='fr'?"Copié":"Copied")).catch(()=>{ const r=document.createRange(); r.selectNodeContents(document.getElementById(el.dataset.copy)); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }); return; }
  if (el.dataset.filter){ state.filter = el.dataset.filter; if (el.tagName === "BUTTON") { render(true); return; } }
  if (STATIC && (el.dataset.pre || el.dataset.offer)){
    e.preventDefault();
    location.href = el.href.split("?")[0] + "?" + (el.dataset.pre ? "dest=" + encodeURIComponent(el.dataset.pre) : "offer=" + encodeURIComponent(el.dataset.offer));
    return;
  }
  if (el.dataset.pre){ state.prefill = { dest: el.dataset.pre }; }
  if (el.dataset.offer){ const o = (window.OFFERS||[]).find(x=>x.id===el.dataset.offer); if (o) state.prefill = { dest: o.dest || "", offer: t(o.title) + " (" + o.price + ")" }; }
  if (STATIC) { if (el.dataset.k === window.SITE.page && (state.drawer || state.megaOpen)) { state.drawer = false; state.megaOpen = null; render(true); } return; }
  if (el.matches("a[href^='#']")){
    state.megaOpen = null; state.drawer = false;
    if (el.getAttribute("href") === location.hash) { e.preventDefault(); render(); window.scrollTo(0,0); }
  }
});
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.form === "search"){
    state.prefill = { dest: f.querySelector("#s-dest").value, out: f.querySelector("#s-out").value, back: f.querySelector("#s-back").value, pax: f.querySelector("#s-pax").value };
    if (STATIC) { const q = new URLSearchParams(Object.entries(state.prefill).filter(([,v])=>v)); location.href = urlFor("devis") + "?" + q.toString(); return; }
    location.hash = "devis"; return;
  }
  if (f.dataset.form === "news"){
    const em = (f.querySelector("input")||{}).value || "";
    const link = wa((lang==='fr'?"Bonjour, je souhaite recevoir vos offres de voyage. Mon email : ":"Hello, I'd like to receive your travel offers. My email: ") + em);
    f.innerHTML = `<p class="note">${lang==='fr'?"Dernière étape : confirmez sur WhatsApp.":"Last step: confirm on WhatsApp."} <a class="link" href="${link}" target="_blank" rel="noopener">WhatsApp →</a></p>`;
    return;
  }
  if (f.dataset.form === "quote"){
    const v = id => (f.querySelector("#"+id)||{}).value || "";
    const sel = f.querySelector("#q-dest"); const destTxt = sel.value ? sel.options[sel.selectedIndex].text : (lang==='fr'?"À définir":"To be defined");
    const svc = [...f.querySelectorAll("input[name=svc]:checked")].map(x=>x.value).join(", ");
    const typeSel = f.querySelector("#q-type");
    const L = lang==='fr';
    const msg = [
      L?"Bonjour, voici ma demande de devis :":"Hello, here is my quote request:",
      `${L?"Type":"Type"} : ${typeSel.options[typeSel.selectedIndex].text}`,
      `${L?"Départ de":"From"} : ${v("q-from")}`,
      `Destination : ${destTxt}`,
      `${L?"Dates":"Dates"} : ${v("q-out")||"?"} → ${v("q-back")||"?"}`,
      `${L?"Voyageurs":"Travellers"} : ${v("q-ad")} + ${v("q-ch")}`,
      `Budget : ${v("q-bud")} · ${L?"Classe":"Cabin"} : ${v("q-cab")}`,
      `Services : ${svc||"-"}`,
      v("q-msg") ? `${L?"Détails":"Details"} : ${v("q-msg")}` : "",
      `— ${v("q-name")} · ${v("q-tel")}${v("q-mail")?" · "+v("q-mail"):""}`
    ].filter(Boolean).join("\n");
    f.outerHTML = `<div class="done">
      <b style="font-weight:400;font-size:22px">${L?"Votre demande est prête":"Your request is ready"}</b>
      <p class="note">${STATIC ? (L?"Envoyez-la sur WhatsApp en un clic, ou copiez le texte pour l'envoyer par email à "+esc(C.email)+".":"Send it on WhatsApp in one click, or copy the text and email it to "+esc(C.email)+".") : (L?"Aperçu : sur le site en ligne, ce formulaire sera envoyé directement par email. Ici, vous pouvez l'envoyer par WhatsApp.":"Preview: on the live site this form will be emailed directly. Here, you can send it via WhatsApp.")}</p>
      <pre id="qmsg">${esc(msg)}</pre>
      <div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn accent" href="${wa(msg)}" target="_blank" rel="noopener">${t(U.whatsapp)}</a><button class="btn ghost" data-copy="qmsg" type="button">${L?"Copier le texte":"Copy text"}</button></div>
    </div>`;
  }
});
if (!STATIC) window.addEventListener("hashchange", () => { state.megaOpen = null; state.drawer = false; render(); });
window.addEventListener("scroll", onScroll, { passive:true });
document.addEventListener("keydown", e => { if (e.key === "Escape" && (state.megaOpen || state.drawer || state.video != null)) { state.megaOpen=null; state.drawer=false; state.video=null; render(true); } });
if (STATIC && document.getElementById("app").children.length){
  /* page is pre-rendered: keep the HTML, only wire up what needs JS */
  lastKey = window.SITE.page;
  if (lastKey === "devis") {
    const q = new URLSearchParams(location.search), o = (window.OFFERS||[]).find(x => x.id === q.get("offer"));
    if (o) state.prefill = { dest: o.dest || "", offer: t(o.title) + " (" + o.price + ")" };
    else if ([...q.keys()].length) state.prefill = { dest: q.get("dest") || "", out: q.get("out") || "", back: q.get("back") || "", pax: q.get("pax") || "" };
    if ([...q.keys()].length) render(true);
  }
  onScroll();
  if (lastKey === "appel") mountCalendly();
} else render();
loadCalendly();
window.PSV = { render, pathFor, urlFor, slugify, destSlug, THEME_SLUG, PAGES };
})();
</script>
